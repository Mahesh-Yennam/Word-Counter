<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="14" y1="10" x2="50" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="32" y1="20" x2="52" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#1e293b" stroke-width="2"/>

  <!-- Document Sheet -->
  <path d="M 16 12 C 16 10, 18 8, 20 8 L 38 8 L 48 18 L 48 52 C 48 54, 46 56, 44 56 L 20 56 C 18 56, 16 54, 16 52 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#neonGlow)"/>
  <path d="M 38 8 L 38 18 L 48 18" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- Text lines on page -->
  <line x1="22" y1="26" x2="36" y2="26" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="34" x2="42" y2="34" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="42" x2="34" y2="42" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Golden Pencil Pen Accent -->
  <path d="M 36 46 L 49 33 C 50 32, 52 32, 53 33 L 55 35 C 56 36, 56 38, 55 39 L 42 52 L 35 53 Z" fill="url(#penGrad)" filter="url(#neonGlow)"/>
  <circle cx="36" cy="52" r="1.5" fill="#f8fafc"/>
</svg>
